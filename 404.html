<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found!</title>
    <style>
        :root {
            --bg-color: #f7f3ee;
            --accent-color: #e07a5f;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #2b2b2b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            background-image: url('https://i.pinimg.com/736x/33/41/e5/3341e5759d02ccaecf733752f39785ef.jpg');
            background-size: cover, fill;
            background-position: center;
        }

        .error-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            color: var(--accent-color);
            letter-spacing: 2px;
            line-height: 1;
        }

        h2 {
            font-size: 1.8rem;
            margin: 10px 0 25px;
            font-weight: 700;
        }

        /* --- 3-Image Gallery Layout --- */
        .meme-gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .meme-card {
            flex: 1;
            min-width: 200px;
            max-width: 260px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            background: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .meme-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .meme-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .meme-caption {
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
            background: #ffffff;
        }

        /* Action Button */
        .btn-home {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 30px;
            background-color: var(--accent-color);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 12px rgba(224, 122, 95, 0.4);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .btn-home:hover {
            background-color: #c86348;
            transform: scale(1.05);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; }
            h2 { font-size: 1.4rem; }
            .meme-gallery {
                flex-direction: column;
                align-items: center;
            }
            .meme-card {
                max-width: 80%;
            }
        }
        
    </style>
</head>
<body>

    <div class="error-card">
        <h1>404</h1>
        <h2>HUHH??? Page Not Found!</h2>
        <p style="color: #666; font-size: 1.05rem; margin: 0;">We searched everywhere, but this page seems to have disappeared into thin air.</p>

        <!-- 3 Images Layout: Left, Center, Right -->
        <div class="meme-gallery">
            <!-- LEFT IMAGE -->
            <div class="meme-card">
                <img src="https://i.pinimg.com/736x/9a/ea/78/9aea787c9a9150ee3997616921fb16d8.jpg" alt="Mingyu Crying Meme">
                <div class="meme-caption">Me searching for the lost URL... 😭</div>
            </div>

            <!-- CENTER IMAGE -->
            <div class="meme-card">
                <img src="https://i.pinimg.com/736x/db/68/7b/db687b1a9108fdf55cee52761d699f46.jpg" alt="Joshua Buffering Meme">
                <div class="meme-caption">Server trying to load this page... 🔄</div>
            </div>

            <!-- RIGHT IMAGE -->
            <div class="meme-card">
                <img src="https://i.pinimg.com/736x/5b/64/72/5b64723a56a27a3b651325cb0049fa4c.jpg" alt="S.Coups Fighting Meme">
                <div class="meme-caption">Who deleted this link?! 🥊</div>
            </div>
        </div>

        <a href="scrapbook.html" class="btn-home">Take Me Back Home 🏠</a>
    </div>

</body>


    <!-- =========================================
         PROFILE JAVASCRIPT
    ========================================= -->

    <script src="js/profile.js"></script>
</html>
