<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SEVENTEEN Fanclub | Profile Setup</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;

            background:
                url('https://i.pinimg.com/736x/2b/c9/f9/2bc9f99e48509ab1199a04a09e5dfbe3.jpg')
                no-repeat center center fixed;

            background-size: cover;
            color: white;
            position: relative;
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background: rgba(10, 5, 20, 0.72);

            z-index: -1;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 620px;
            max-height: 92vh;

            padding: 35px 30px;

            background: rgba(35, 32, 62, 0.82);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 113, 206, 0.35);

            border-radius: 25px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.65),
                0 0 30px rgba(255, 113, 206, 0.15);

            overflow-y: auto;
        }

        /* Scrollbar */

        .container::-webkit-scrollbar {
            width: 7px;
        }

        .container::-webkit-scrollbar-track {
            background: transparent;
        }

        .container::-webkit-scrollbar-thumb {
            background: linear-gradient(
                #ff71ce,
                #01cdfe
            );

            border-radius: 20px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .star {
            font-size: 25px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: clamp(22px, 5vw, 28px);

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

            background:
                linear-gradient(
                    90deg,
                    #ff71ce,
                    #01cdfe,
                    #ff71ce
                );

            background-size: 200% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation: gradientMove 4s linear infinite;
        }

        @keyframes gradientMove {
            to {
                background-position: 200% center;
            }
        }

        .subtitle {
            margin-top: 8px;

            color: #d9d9e5;

            font-size: 13px;

            letter-spacing: 0.5px;
        }

        /* =========================
           SECTION
        ========================= */

        .profile-section {
            margin-bottom: 25px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 12px;

            color: #01cdfe;

            font-size: 13px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1.5px;
        }

        .section-title::after {
            content: "";

            flex: 1;

            height: 1px;

            background: linear-gradient(
                to right,
                rgba(1, 205, 254, 0.5),
                transparent
            );
        }

        /* =========================
           INPUTS
        ========================= */

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            color: #ff71ce;

            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1.3px;
        }

        .input-group input,
        .input-group textarea {

            width: 100%;

            padding: 13px 16px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.18);

            border-radius: 14px;

            color: white;

            font-size: 14px;

            outline: none;

            transition: 0.3s ease;
        }

        .input-group input::placeholder,
        .input-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .input-group input:focus,
        .input-group textarea:focus {

            background: rgba(255, 255, 255, 0.13);

            border-color: #ff71ce;

            box-shadow:
                0 0 12px rgba(255, 113, 206, 0.35);

            transform: translateY(-1px);
        }

        .input-group textarea {
            height: 85px;

            resize: vertical;

            min-height: 70px;
            max-height: 150px;
        }

        /* =========================
           BIAS SECTION
        ========================= */

        .bias-note {
            font-size: 12px;

            color: #bdbdcc;

            margin-top: -4px;

            margin-bottom: 18px;
        }

        .member-grid {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(70px, 1fr));

            gap: 17px 12px;

            margin-bottom: 25px;
        }

        .member-card {

            position: relative;

            cursor: pointer;

            text-align: center;

            transition: 0.3s ease;
        }

        .member-card input {
            display: none;
        }

        .member-image-wrapper {

            position: relative;

            width: 72px;
            height: 72px;

            margin: auto;

            border-radius: 50%;
        }

        .member-card img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            border: 2px solid transparent;

            opacity: 0.65;

            transition: 0.3s ease;
        }

        .member-card span {

            display: block;

            margin-top: 7px;

            color: #c7c7d1;

            font-size: 11px;

            font-weight: 500;

            transition: 0.3s ease;
        }

        /* Hover */

        .member-card:hover img {

            opacity: 1;

            transform: scale(1.08);

            border-color: rgba(1, 205, 254, 0.6);
        }

        .member-card:hover span {
            color: #01cdfe;
        }

        /* Selected */

        .member-card input:checked + .member-image-wrapper img {

            opacity: 1;

            border-color: #ff71ce;

            transform: scale(1.12);

            box-shadow:
                0 0 10px #ff71ce,
                0 0 25px rgba(255, 113, 206, 0.5);
        }

        .member-card input:checked ~ span {

            color: #ff71ce;

            font-weight: 800;
        }

        /* Check mark */

        .member-card input:checked + .member-image-wrapper::after {

            content: "✓";

            position: absolute;

            right: -3px;
            bottom: -2px;

            width: 22px;
            height: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ff71ce;

            color: white;

            border-radius: 50%;

            font-size: 13px;

            font-weight: bold;

            border: 2px solid #24213f;

            box-shadow: 0 0 10px rgba(255, 113, 206, 0.7);
        }

        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #ff3399,
                    #9356d0,
                    #01cdfe
                );

            background-size: 200% 200%;

            color: white;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 1.5px;

            cursor: pointer;

            transition: 0.3s ease;

            box-shadow:
                0 5px 20px rgba(255, 51, 153, 0.35);
        }

        .submit-btn:hover {

            transform: translateY(-3px);

            background-position: right center;

            box-shadow:
                0 8px 30px rgba(255, 51, 153, 0.55);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer-note {

            text-align: center;

            margin-top: 15px;

            color: #85859a;

            font-size: 10px;

            letter-spacing: 0.5px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 520px) {

            body {
                padding: 15px 10px;
                align-items: flex-start;
            }

            .container {
                padding: 28px 20px;
                max-height: 95vh;
            }

            .member-grid {
                grid-template-columns:
                    repeat(4, 1fr);

                gap: 16px 5px;
            }

            .member-image-wrapper {
                width: 60px;
                height: 60px;
            }

            .member-card span {
                font-size: 9px;
            }
        }

        @media (max-width: 360px) {

            .member-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }

            .member-image-wrapper {
                width: 65px;
                height: 65px;
            }
        }
    </style>
</head>

    <script>

        /* =========================
           OFFLINE REDIRECT
        ========================== */

        window.addEventListener("offline", () => {

            window.location.href = "404.html";

        });


        /* =========================
           PROFILE FORM
        ========================== */

        const profileForm =
            document.getElementById("profileForm");


        profileForm.addEventListener("submit", function (event) {

            event.preventDefault();


            /* Get user information */

            const username =
                document.getElementById("username").value.trim();

            const bio =
                document.getElementById("bio").value.trim();

            const selectedBias =
                document.querySelector(
                    'input[name="bias"]:checked'
                );


            /* Make sure bias exists */

            if (!selectedBias) {

                alert("Please choose your SEVENTEEN bias 💎");

                return;

            }


            /* Find selected member card */

            const memberCard =
                selectedBias.closest(".member-card");


            const memberImage =
                memberCard.querySelector("img");


            const memberImgSrc =
                memberImage.src;


            const memberName =
                selectedBias.value;


            /* =========================
               PROFILE DATA
               
               AGE IS INTENTIONALLY HIDDEN
               ========================== */

            const userProfile = {

                name: username,

                bio: bio,

                age: null,

                biasName: memberName,

                biasImage: memberImgSrc,

                createdAt:
                    new Date().toISOString()

            };


            /* Save profile */

            localStorage.setItem(
                "userProfile",
                JSON.stringify(userProfile)
            );


            /* Redirect */

            window.location.href =
                "scrapbook.html";

        });


        /* =========================
           LOAD EXISTING PROFILE
        ========================== */

        const savedProfile =
            localStorage.getItem("userProfile");


        if (savedProfile) {

            try {

                const profile =
                    JSON.parse(savedProfile);

                console.log(
                    `Welcome back, ${profile.name}! 💎`
                );

            } catch (error) {

                console.log(
                    "Unable to load saved profile."
                );

            }

        }

    </script>
