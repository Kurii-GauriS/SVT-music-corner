<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seventeen Fanclub | Profile Setup</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            background: url('https://i.pinimg.com/736x/2b/c9/f9/2bc9f99e48509ab1199a04a09e5dfbe3.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 20, 0.65);
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 30px 25px;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(44, 42, 72, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(236, 72, 153, 0.2);
            color: #ffffff;
        }

        /* Custom Scrollbar for Container */
        .container::-webkit-scrollbar {
            width: 6px;
        }
        .container::-webkit-scrollbar-thumb {
            background: #ff71ce;
            border-radius: 10px;
        }

        h2 {
            font-size: 24px;
            margin: 0 0 5px 0;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ff71ce, #01cdfe);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 13px;
            color: #e0e0e0;
            margin: 0 0 20px 0;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #ff71ce;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group textarea {
            resize: none;
            height: 60px;
        }

        .input-group input:focus, .input-group textarea:focus {
            background: rgba(255, 255, 255, 0.18);
            border-color: #ff71ce;
            box-shadow: 0 0 10px rgba(255, 113, 206, 0.5);
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #01cdfe;
            margin: 20px 0 10px 0;
            text-align: left;
        }

        /* Member Grid Selection */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }

        .member-card {
            cursor: pointer;
            position: relative;
        }

        .member-card input {
            display: none;
        }

        .member-card img {
            width: 100%;
            height: 75px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .member-card span {
            display: block;
            font-size: 11px;
            margin-top: 4px;
            color: #ccc;
        }

        /* Hover & Selected States */
        .member-card:hover img {
            opacity: 1;
            transform: scale(1.05);
        }

        .member-card input:checked + img {
            border-color: #ff71ce;
            opacity: 1;
            box-shadow: 0 0 12px #ff71ce;
            transform: scale(1.1);
        }

        .member-card input:checked ~ span {
            color: #ff71ce;
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 0;
            background: linear-gradient(135deg, #ff3399, #9356d0);
            border: none;
            border-radius: 30px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 153, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 51, 153, 0.7);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Create Your Profile</h2>
    <p class="subtitle">Join the fandom & pick your bias</p>

    <form action="scrapbook.html" method="GET">
        <div class="input-group">
            <label for="username">Display Name</label>
            <input type="text" id="username" placeholder="e.g. Carat_17" required>
        </div>

        <div class="input-group">
            <label for="bio">Short Bio</label>
            <textarea id="bio" placeholder="Tell us why you love Seventeen..."></textarea>
        </div>

        <div class="section-title">Select Your Bias Image</div>
        
        <div class="member-grid">
            <label class="member-card">
                <input type="radio" name="bias" value="S.Coups" required>
                <img src="https://i.pinimg.com/736x/8c/ff/36/8cff36620f23fd72fbf3faae8f1e243f.jpg" alt="S.Coups">
                <span>S.Coups</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="Jeonghan">
                <img src="https://i.pinimg.com/736x/f4/74/f1/f474f1a990c838b388d9425fa379cd1f.jpg" alt="Jeonghan">
                <span>Jeonghan</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="Joshua">
                <img src="https://i.pinimg.com/736x/d1/16/5f/d1165f408b27becd13992a1f3d5d8709.jpg" alt="Joshua">
                <span>Joshua</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="Jun">
                <img src="https://i.pinimg.com/736x/45/bc/c7/45bcc7734e8b93f5e6a748806b0a81b4.jpg" alt="Jun">
                <span>Jun</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="Hoshi">
                <img src="https://i.pinimg.com/736x/5a/7a/09/5a7a09700c7a40983d34ea607dd38167.jpg" alt="Hoshi">
                <span>Hoshi</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="Wonwoo">
                <img src="https://i.pinimg.com/736x/e8/b6/b1/e8b6b131a9fce588576749d61fba6ccb.jpg" alt="Wonwoo">
                <span>Wonwoo</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="Woozi">
                <img src="https://i.pinimg.com/736x/be/84/db/be84db2c2b0adbf260fc1d153b633694.jpg" alt="Woozi">
                <span>Woozi</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="DK">
                <img src="https://i.pinimg.com/736x/bc/e2/90/bce29056e37a6e03ac63c676e341599d.jpg" alt="DK">
                <span>DK</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="Mingyu">
                <img src="https://i.pinimg.com/736x/d9/15/e1/d915e12df93cec64174fc6b73449be39.jpg" alt="Mingyu">
                <span>Mingyu</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="The8">
                <img src="https://i.pinimg.com/736x/13/93/d3/1393d3cff5cafb0d7821995f45974ad3.jpg" alt="The8">
                <span>The8</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="Seungkwan">
                <img src="https://i.pinimg.com/736x/5b/2b/0e/5b2b0e3c84af6993c4f3e1f62b706fac.jpg" alt="Seungkwan">
                <span>Seungkwan</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="Vernon">
                <img src="https://i.pinimg.com/736x/bc/c5/f8/bcc5f87678b244b622e611ba879fa377.jpg" alt="Vernon">
                <span>Vernon</span>
            </label>
            <label class="member-card">
                <input type="radio" name="bias" value="Dino">
                <img src="https://i.pinimg.com/736x/6d/2a/35/6d2a35eaa3fb9f1c41ae73da0f9d083d.jpg" alt="Dino">
                <span>Dino</span>
            </label>
        </div>

        <button type="submit" class="submit-btn">
            <nav class="enter">
            ENTER THE GROOVE</nav>
        </button>
    </form>
</div>

<script>
    window.addEventListener("offline", () => {
        window.location.href = "404.html";
    });
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent standard page jump

        // Capture values
        const username = document.getElementById('username').value;
        const bio = document.getElementById('bio').value;
        const selectedBias = document.querySelector('input[name="bias"]:checked');

        if (selectedBias) {
            const memberCard = selectedBias.closest('.member-card');
            const memberImgSrc = memberCard.querySelector('img').src;
            const memberName = selectedBias.value;

            // Save to localStorage
            localStorage.setItem('userProfile', JSON.stringify({
                name: username,
                bio: bio,
                biasName: memberName,
                biasImage: memberImgSrc
            }));

            // Redirect to scrapbook page
            window.location.href = 'scrapbook.html';
        }
    });

    window.addEventListener("offline", () => {
        window.location.href = "404.html";
    });
    const savedProfile = localStorage.getItem("userProfile");

if (savedProfile) {
    console.log("Welcome back, Carat!");
}
</script>

</body>
</html>
