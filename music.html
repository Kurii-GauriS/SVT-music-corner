<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEVENTEEN Album Collection</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            padding: 50px 20px;
            color: #ffffff;
            background: url('https://i.pinimg.com/736x/7d/dc/14/7ddc14c904ce78a817651e76a887a4ad.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Dark overlay for contrast */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        /* Top Navigation Header */
        .nav-container {
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .glass-btn {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #f5d5ff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .page-title {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        /* Responsive Album Grid */
        .album-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 360px));
            gap: 30px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
        }

        /* Spotify Card Container */
        .album-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 18px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, background 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .album-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .album-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .album-title {
            margin: 0;
            font-size: 18px;
            color: #ffffff;
            font-weight: 600;
        }

        .album-date {
            font-size: 12px;
            color: #f5d5ff;
            font-weight: 500;
        }

        /* Spotify Frame Wrapper */
        .spotify-frame {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: transparent;
        }

        .spotify-frame iframe {
            display: block;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <div class="nav-container">
        <a href="index.html" class="glass-btn">🏡 H♡me</a>
        <a href="scrapbook.html" class="glass-btn">📖Scrapbook</a>
        <a href="binder.html" class="glass-btn">✨PC Binder❤︎</a>
        <a href="svt.html" class="glass-btn">💎Photo Booth💎</a>
        <a href="going.html" class="glass-btn">❤︎Going Seventeen💎</a>
        <a href="game.html" class="glass-btn">🧩Puzzle Game</a>
    </div>

    <h1 class="page-title">
        <b><i>💿 SEVENTEEN Discography 💿</i></b>
    </h1>

    <div class="album-container">

          <!-- 🎀17 CARAT First mini album -->
        <div class="album-card">
            <div class="album-header">
                <h2 class="album-title">🎀17 CARAT</h2>
                <span class="album-date">May 29, 2015</span>
            </div>
            <div class="spotify-frame">
                <iframe data-testid="embed-iframe" 
                style="border-radius:12px" 
                src="https://open.spotify.com/embed/album/0H2K2JrzdvJcxBEPyxC2sl?utm_source=generator&theme=0&si=9850f40fd1fa431d"
                 width="100%"
                  height="352" 
                  frameBorder="0" 
                  allowfullscreen=""
                   allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
                </iframe>" 
                    
            </div>
        </div>

        <!-- 1st Studio Album: Love & Letter -->
        <div class="album-card">
            <div class="album-header">
                <h2 class="album-title">💌 Love & Letter</h2>
                <span class="album-date">Apr 25, 2016</span>
            </div>
            <div class="spotify-frame">
                <iframe 
                    src="https://open.spotify.com/embed/album/7mP7AFehQDonPKEQiXvpvB?utm_source=generator&theme=0" 
                  width="100%"
                  height="352" 
                  frameBorder="0" 
                  allowfullscreen=""
                   allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
                </iframe>" 
            </div>
        </div>

    </div>

    <script>
        window.addEventListener("offline", () => {
            window.location.href = "404.html";
        });
    </script>
</body>
</html>
