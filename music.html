<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEVENTEEN Album Collection</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            padding: 40px 20px;
            color: #ffffff;
            background: url('https://i.pinimg.com/1200x/e0/36/f5/e036f50fbd5f0a5a2ac041a24ce1aaa6.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Dark overlay for contrast */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        /* Top Navigation Header */
        .nav-container {
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .glass-btn {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #f5d5ff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .page-title {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        /* Responsive Album Grid */
        .album-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 360px));
            gap: 30px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
        }

        /* Spotify Card Container */
        .album-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 18px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, background 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .album-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .album-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .album-title {
            margin: 0;
            font-size: 18px;
            color: #ffffff;
            font-weight: 600;
        }

        .album-date {
            font-size: 12px;
            color: #f5d5ff;
            font-weight: 500;
        }

        /* Spotify Frame Wrapper */
        .spotify-frame {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: transparent;
        }

        .spotify-frame iframe {
            display: block;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <div class="nav-container">
        <a href="main.html" class="glass-btn">🏡 H♡me</a>
        <a href="music.html" class="glass-btn">❤️💌 Love & Letter</a>
        <a href="" class="glass-btn">✨</a>
        <a href="" class="glass-btn">💿 </a>
        <a href="" class="glass-btn">❤︎ </a>
    </div>

    <h1 class="page-title">
        <b><i>💿 SEVENTEEN Discography 💿</i></b>
    </h1>

    <div class="album-container">

        <!-- 1st Studio Album: Love & Letter -->
        <div class="album-card">
            <div class="album-header">
                <h2 class="album-title">💌 Love & Letter</h2>
                <span class="album-date">Apr 25, 2016</span>
            </div>
            <div class="spotify-frame">
                <iframe 
                    src="https://open.spotify.com/embed/album/7mP7AFehQDonPKEQiXvpvB?utm_source=generator&theme=0" 
                    width="100%" 
                    height="152" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
                </iframe>
            </div>
        </div>

        <!-- Repackage Album: Very Nice / Love & Letter Repackage -->
        <div class="album-card">
            <div class="album-header">
                <h2 class="album-title">🎀 Love & Letter (Repackage)</h2>
                <span class="album-date">Jul 4, 2016</span>
            </div>
            <div class="spotify-frame">
                <iframe 
                    src="https://open.spotify.com/embed/album/32x1E0e26I4M8S4A83xP8R?utm_source=generator&theme=0" 
                    width="100%" 
                    height="152" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
                </iframe>
            </div>
        </div>

    </div>

    <script>
        window.addEventListener("offline", () => {
            window.location.href = "404.html";
        });
    </script>
</body>
</html>
